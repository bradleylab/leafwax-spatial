name: R deps lint

on:
  pull_request:
    paths:
      - '**/*.R'
      - 'Dockerfile'
      - '.github/scripts/check_r_deps.R'
      - '.github/workflows/check-r-deps.yml'
  push:
    branches: [master]
    paths:
      - '**/*.R'
      - 'Dockerfile'
      - '.github/scripts/check_r_deps.R'
      - '.github/workflows/check-r-deps.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.1'
          use-public-rspm: true
      - name: Check library() vs Dockerfile install.packages
        run: Rscript .github/scripts/check_r_deps.R
