# Configuration for leafwax spatial d2H calibration pipeline
# 14 manuscript models (see model_configs below)
# MCMC settings from most recent successful run chain CSV headers

# scripts
scripts:
  spatial_functions: "4a_spatial_functions.R"
  prep_script: "4b_stan_prep.R"
  fit_script: "4c_fit_models.R"
  stan_model: "4d_leaf_wax_spatial_model.stan"

# Input/Output paths
input_data: "results/3_sediment_ready_for_modeling.rds"
output_dirs:
  prepared_data: "prepared_data"
  model_output: "model_output"
  results: "results"
  logs: "logs"

# Data source paths
data_sources:
  c4_netcdf: "input_data/C4_distribution_NUS_v2.2.nc"
  oipc_d2h: "input_data/GlobalPrecip/d2h_MA.tif"
  oipc_se: "input_data/GlobalPrecip/d2h_se_MA.tif"
  elevation: "input_data/elevation_5KMmn_GMTEDmn.tif"
  sediment_csv: "input_data/global_data_c29.csv"

# Spatial scale parameters
spatial_scales: [1, 3, 5, 10, 20, 40, 70, 100, 150]  # km

# Lambda (spatial integration scale) control
lambda_control:
  estimate: true
  fixed_value: 13  # km (not normalized)
  prior_mean_log: 2.5  # around 12 km
  prior_sd_log: 0.5    # 95% interval between roughly 4 and 28

# GP regularization parameters
# Neighborhood radii are defined in kilometres and applied on the chordal
# (3-D Euclidean on the sphere) metric. They replace the former
# density_radius_std (0.2 standardized units), which under per-axis coordinate
# standardization was an anisotropic ellipse (~1791 km E-W x 643 km N-S,
# equal-area radius ~1073 km). density_scaling (formerly 10) was declared but
# never used inside the Stan model and has been removed.
gp_regularization:
  density_radius_km: 1000        # radius for counting nearby sites -> base tau
  oipc_range_radius_km: 1000     # radius for local OIPC-range -> range_factor
                                 # (the Stan model's former hardcoded 1000 km intent)
  apply_range_factor: true       # set FALSE for range_factor-off sensitivity fits

# GP spatial length-scale prior (chordal km parameterization).
# Nominal km re-expression of the former standardized-unit prior
# normal(-1.0, 0.4) on log_ls_spatial_raw with bounds [-2, 0], via the frozen
# run's coord_scale_km = mean(coord_scaling) * 111 = 6434.1 km:
#   median  = exp(-1.0) * 6434.1 = 2367 km ; log-km mean = -1.0 + log(6434.1)
#   bounds  = [exp(-2), exp(0)] * 6434.1 = [870.8, 6434.1] km
# This preserves the former prior's nominal centre/bounds; it is NOT an exact
# geometric equivalent (the former metric was anisotropic, so no single isotropic
# prior reproduces it). Bounds are ~±2.5 prior SD from the mean; a converged
# baseline_sp pilot must confirm no posterior pile-up at a bound before the full
# batch. Distances are now chordal km, so the length scale is reported directly
# in km (no coord_scale_km back-conversion).
gp_length_scale:
  prior_mean_log_km: 7.7694      # log(2367); median length scale ~2367 km
  prior_sd_log: 0.4              # log-scale SD (unchanged from former prior)
  lower_km: 870.8                # exp(-2) * 6434.1
  upper_km: 6434.1               # exp(0)  * 6434.1

# Penalized complexity prior for spatial variance
pc_prior_intercept:
  use_pc_prior: true
  u_permil: 20      # Threshold in permil for intercept variation
  alpha: 0.05       # P(sigma > 20 permil) = 0.05

pc_prior_slope:
  use_pc_prior: true
  u_value: 0.3      # Threshold for slope variation (unitless)
  alpha: 0.05       # P(sigma > 0.3) = 0.05

# Knot selection parameters
knot_selection_method: "regular_global"
min_dist_quantile: 0.05

# Elevation b-spline configuration
n_elevation_knots: 9        # Interior knots for B-splines
elevation_spline_degree: 3  # Cubic B-splines

# Standardization parameters
c4_standardization:
  mean: 20
  sd: 25

climate_standardization:
  compute_from_data: true

# Numerical stability parameters
kernel_jitter: 1e-4
coordinate_jitter: 0.0001
max_condition_number: 1e6
min_eigenvalue: -1e-6

# Stan sampling defaults
stan_seed: 314
warmup_ratio: 0.5
refresh: 100

# Progress reporting
progress_interval_divisor: 10

# Parallel execution
max_parallel_models: 4

# Model selection criteria
model_selection:
  criteria: ["loo", "waic", "r_squared", "rmse"]
  best_model_selection: "loo"

# Posterior predictive check settings
ppc_settings:
  n_samples: 1000
  checks: ["density_overlay", "intervals", "stat_mean", "stat_sd", "spatial_residuals"]

# ─── Models to run ───
# 14 manuscript comparison models
# iter = total iterations (warmup + sampling); warmup_ratio = 0.5 applies
#
# Non-spatial models: iter=2000, adapt_delta=0.95, max_treedepth=15
# Spatial _veg models: iter=3000, adapt_delta=0.95, max_treedepth=14
# Spatial _env/full models: iter=3000-4000, adapt_delta=0.99, max_treedepth=12
#
# Retune 2026-06-23 (after the frozen-data refresh; see HANDOFF.md), targeting the
# only three models with diagnostic flags in the 2026-05-01 run:
#   baseline_env      iter 2000 -> 6000        (Rhat 1.011, ESS 857 -> lift mixing)
#   full_sp           adapt_delta 0.99 -> 0.995 (8 residual divergences)
#   full_interact_sp  adapt_delta 0.99 -> 0.995 (1 residual divergence)
# The other 11 models were clean (0 div, Rhat < 1.008, ESS > 1000) and are unchanged.

model_configs:
  # ── Non-spatial models (fast, ~1-2 hrs each) ──
  baseline:
    name: "baseline"
    include_c4: false
    include_pft: false
    include_gp: false
    include_elevation: false
    include_precip: false
    include_veg_interactions: false
    n_pp_knots: 0
    chains: 8
    iter: 2000
    adapt_delta: 0.95
    max_treedepth: 15

  baseline_veg:
    name: "baseline_veg"
    include_c4: true
    include_pft: true
    include_gp: false
    include_elevation: false
    include_precip: false
    include_veg_interactions: true
    n_pp_knots: 0
    chains: 8
    iter: 2000
    adapt_delta: 0.95
    max_treedepth: 15

  baseline_env:
    name: "baseline_env"
    include_c4: false
    include_pft: false
    include_gp: false
    include_elevation: true
    include_precip: true
    include_veg_interactions: false
    n_pp_knots: 0
    chains: 8
    iter: 6000          # retuned 2026-06-23: was 2000; lifts ESS (was 857) + Rhat (was 1.011) on the elevation B-spline coef
    adapt_delta: 0.95
    max_treedepth: 15

  full:
    name: "full"
    include_c4: true
    include_pft: true
    include_gp: false
    include_elevation: true
    include_precip: true
    include_veg_interactions: false
    n_pp_knots: 0
    chains: 8
    iter: 2000
    adapt_delta: 0.95
    max_treedepth: 15

  full_interact:
    name: "full_interact"
    include_c4: true
    include_pft: true
    include_gp: false
    include_elevation: true
    include_precip: true
    include_veg_interactions: true
    n_pp_knots: 0
    chains: 8
    iter: 2000
    adapt_delta: 0.95
    max_treedepth: 15

  # ── Spatial models (slow, 5-30 hrs each) ──
  baseline_sp:
    name: "baseline_sp"
    include_c4: false
    include_pft: false
    include_gp: true
    include_elevation: false
    include_precip: false
    include_veg_interactions: false
    n_pp_knots: 125
    chains: 8
    iter: 3000
    adapt_delta: 0.99
    max_treedepth: 15

  baseline_veg_sp:
    name: "baseline_veg_sp"
    include_c4: true
    include_pft: true
    include_gp: true
    include_elevation: false
    include_precip: false
    include_veg_interactions: true
    n_pp_knots: 125
    chains: 8
    iter: 3000
    adapt_delta: 0.95
    max_treedepth: 14

  baseline_env_sp:
    name: "baseline_env_sp"
    include_c4: false
    include_pft: false
    include_gp: true
    include_elevation: true
    include_precip: true
    include_veg_interactions: false
    n_pp_knots: 125
    chains: 8
    iter: 3000
    adapt_delta: 0.999   # chordal re-tune 2026-07-25: 0.99->0.999 (0.99 left 7 divergences under chordal geometry)
    max_treedepth: 13    # raised 12->13 to avoid treedepth saturation at adapt_delta 0.999

  c4_only_sp:
    name: "c4_only_sp"
    include_c4: true
    include_pft: false
    include_gp: true
    include_elevation: false
    include_precip: false
    include_veg_interactions: false
    n_pp_knots: 125
    chains: 8
    iter: 3000
    adapt_delta: 0.99
    max_treedepth: 12

  elevation_only_sp:
    name: "elevation_only_sp"
    include_c4: false
    include_pft: false
    include_gp: true
    include_elevation: true
    include_precip: false
    include_veg_interactions: false
    n_pp_knots: 125
    chains: 8
    iter: 3000
    adapt_delta: 0.99
    max_treedepth: 12

  elevation_c4_sp:
    name: "elevation_c4_sp"
    include_c4: true
    include_pft: false
    include_gp: true
    include_elevation: true
    include_precip: false
    include_veg_interactions: false
    n_pp_knots: 125
    chains: 8
    iter: 3000
    adapt_delta: 0.999   # chordal re-tune 2026-07-25: 0.99->0.999 (0.99 left 5 divergences under chordal geometry)
    max_treedepth: 13    # raised 12->13 to avoid treedepth saturation at adapt_delta 0.999

  elevation_c4_interact_sp:
    name: "elevation_c4_interact_sp"
    include_c4: true
    include_pft: false
    include_gp: true
    include_elevation: true
    include_precip: false
    include_veg_interactions: true
    n_pp_knots: 125
    chains: 8
    iter: 4000
    adapt_delta: 0.999   # chordal re-tune 2026-07-25: 0.99->0.999 (0.99 left 3 divergences under chordal geometry)
    max_treedepth: 13    # raised 12->13 to avoid treedepth saturation at adapt_delta 0.999

  full_sp:
    name: "full_sp"
    include_c4: true
    include_pft: true
    include_gp: true
    include_elevation: true
    include_precip: true
    include_veg_interactions: false
    n_pp_knots: 125
    chains: 8
    iter: 4000
    adapt_delta: 0.999   # retuned 2026-06-28: 0.99->0.995->0.999; 0.995 left 2 divergences
    max_treedepth: 13    # raised 12->13 with adapt_delta 0.999 to avoid treedepth saturation

  full_interact_sp:
    name: "full_interact_sp"
    include_c4: true
    include_pft: true
    include_gp: true
    include_elevation: true
    include_precip: true
    include_veg_interactions: true
    n_pp_knots: 125
    chains: 8
    iter: 4000
    adapt_delta: 0.999   # retuned 2026-06-28: 0.99->0.995->0.999; 0.995 left 4 divergences
    max_treedepth: 13    # raised 12->13 with adapt_delta 0.999 to avoid treedepth saturation

  # --- range_factor-off sensitivity variants (chordal batch, spec v2 §3) ---
  # Clones of three spatial models with the OIPC range_factor slope-shrinkage
  # DISABLED (apply_range_factor: false, a per-model override of the global
  # gp_regularization.apply_range_factor). Everything else — including the chordal
  # metric, km neighborhoods, and sampling params — matches the base model. Used to
  # gate whether range_factor materially changes a manuscript-level claim.
  baseline_sp_rfoff:
    name: "baseline_sp_rfoff"
    include_c4: false
    include_pft: false
    include_gp: true
    include_elevation: false
    include_precip: false
    include_veg_interactions: false
    n_pp_knots: 125
    apply_range_factor: false
    chains: 8
    iter: 3000
    adapt_delta: 0.99
    max_treedepth: 15

  baseline_env_sp_rfoff:
    name: "baseline_env_sp_rfoff"
    include_c4: false
    include_pft: false
    include_gp: true
    include_elevation: true
    include_precip: true
    include_veg_interactions: false
    n_pp_knots: 125
    apply_range_factor: false
    chains: 8
    iter: 3000
    adapt_delta: 0.999   # chordal re-tune 2026-07-25: 0.99->0.999 (0.99 left 3 divergences under chordal geometry)
    max_treedepth: 13    # raised 12->13 to avoid treedepth saturation at adapt_delta 0.999

  full_interact_sp_rfoff:
    name: "full_interact_sp_rfoff"
    include_c4: true
    include_pft: true
    include_gp: true
    include_elevation: true
    include_precip: true
    include_veg_interactions: true
    n_pp_knots: 125
    apply_range_factor: false
    chains: 8
    iter: 4000
    adapt_delta: 0.999
    max_treedepth: 13
